; ============================================================
;  GAME SETTINGS — every tunable value of the prototype.
;  Edit a value, save, and re-run the game. No code changes needed.
;
;  Format: [section] then  key = value
;    - text goes in "quotes"
;    - colors are "#RRGGBB" hex codes
;    - lines starting with ; are comments
; ============================================================

[window]
title = "My Prototype"
width = 1280
height = 720
background_color = "#1e1e28"

[controls]
; Comma-separated key names (e.g. "Left, A"). Names as Godot spells them.
move_left = "Left, A"
move_right = "Right, D"
move_up = "Up, W"
move_down = "Down, S"

[player]
start_x = 640.0
start_y = 360.0
speed = 300.0           ; pixels per second
size = 40.0             ; side length of the square, in pixels
color = "#4fc3f7"
