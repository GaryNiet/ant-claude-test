; ============================================================
;  GAME SETTINGS — every tunable value of the prototype.
;  Edit a value, save, and re-run the game. No code changes needed.
;
;  Format: [section] then  key = value
;    - text goes in "quotes"
;    - colors are "#RRGGBB" hex codes
;    - lines starting with ; are comments
;
;  Units: distances in pixels (1 grid cell = cell_size pixels, 1 tile = tile_cells cells),
;  times in seconds, speeds in pixels per second.
; ============================================================

[window]
title = "Ant Colony Simulation"
; The window is always 16:9. The player picks the resolution in the in-game Settings menu
; (remembered in Godot's user folder, user://player_settings.cfg).
resolutions = "1280x720, 1920x1080, 2560x1440, 3840x2160" ; 720p, 1080p, 1440p, 4K
default_resolution = "1920x1080" ; used until the player picks one (shrunk if the screen is smaller)
default_fullscreen = false     ; fullscreen until the player changes it (Settings menu or F11)
; Everything is laid out at this size and scaled to the window, so all resolutions look the same.
layout_width = 1600
layout_height = 900
background_color = "#14110d"           ; dark warm brown behind the map

[game]
levels_folder = "res://levels"             ; where Save / Load level look first

[menu]
; The main menu shown when the game starts. One button per level, in this order.
levels = "res://levels/level_1.level, res://levels/level_2.level, res://levels/level_3.level, res://levels/level_4.level"
title_font_size = 48
button_font_size = 22
button_width = 420             ; pixels
button_spacing = 10            ; pixels between two buttons

[sound]
; Music and sound effects, made by tools/make_sounds.py (run it again after changing a sound).
; Volumes in decibels: 0 = as recorded, -6 = about half as loud. The player sets the overall
; music and effects volumes (0 .. 1) in the Settings menu; these are the defaults.
folder = "res://sounds"
music_file = "music.wav"       ; loops on every screen
music_volume_db = -8.0
default_music_volume = 0.6
default_effects_volume = 0.8
effect_voices = 8              ; effects that can play at the same time
effects = "spider_death, spider_arrival, hatch, click"
; Per effect: its volume, and the shortest time between two plays (seconds, real time).
spider_death_volume_db = 0.0   ; a spider is killed
spider_death_min_interval = 0.3
spider_arrival_volume_db = -4.0 ; a spider comes onto the map
spider_arrival_min_interval = 2.0
hatch_volume_db = -14.0        ; one of our larvae hatches (often: kept quiet)
hatch_min_interval = 0.25
click_volume_db = -10.0        ; a button is pressed
click_min_interval = 0.05

[ui]
; Screen layout: the map in the top left; under it the gameplay bar (pause, upgrades, menu);
; on the right the side panel with the building / testing tools and all the data.
toolbar_height = 104           ; pixels, the gameplay bar at the bottom
side_panel_width = 420         ; pixels, the panel on the right
tool_button_size = 72          ; pixels, the square buttons (building tools, pause, menu)
slider_width = 260             ; pixels, the sliders of the Behaviour and Settings menus
slider_label_width = 170
volume_slider_step = 0.05      ; the volume sliders of the Settings menu move by this much
tech_button_width = 210        ; pixels, the buttons of the Tech tree menu
tech_indent = 24               ; pixels, nodes that need another node are indented this much
tech_column_gap = 18           ; pixels between the vocation columns
tool_icon_size = 36            ; pixels, the picture on a tool bar button
tool_font_size = 12
small_button_size = 32         ; pixels, small buttons (brush size - and +)
; Buttons look like in-game buttons: raised with a darker bottom edge, pushed in when pressed
; or selected, and they shrink a little while held down (click animation).
button_color = "#4a3a2a"
button_hover_color = "#5c4834"
button_pressed_color = "#2e241a"
button_disabled_color = "#2a221b"
button_border_color = "#1c150f"
button_selected_border_color = "#d9a441" ; ochre: the selected tool
button_disabled_text_color = "#7a6a58"
button_corner_radius = 6
progress_color = "#d9a441"     ; ochre: progress bars (the hatching bar)
progress_bar_height = 14       ; pixels
queue_bar_width = 64           ; pixels, the laying and hatching bars of the gameplay bar
click_scale = 0.9              ; size while held down
click_time = 0.06              ; seconds to shrink / spring back
font_size = 15
panel_color = "#1e1813"       ; warm dark brown, like the inspiration art

[controls]
; Comma-separated key names (e.g. "Space, P"). Names as Godot spells them.
; Mouse: "Mouse Left", "Mouse Right", "Mouse Middle", "Wheel Up", "Wheel Down".
pause = "Space, P"
restart = "R"
paint = "Mouse Left"           ; use the tool: inspect / place an object / paint terrain / erase / move the nest
cancel = "Mouse Right"         ; a click (without dragging): closes the menus, back to the Inspect tool
; Building tools (side panel, like management games): Inspect, Food, Obstacles, Terrain, Nest, Erase.
; Food, Obstacles and Terrain open their own page with the things to place; Back returns.
tool_inspect = "1"
menu_food = "2"
menu_obstacles = "3"
menu_terrain = "4"
tool_nest = "5"
tool_erase = "6"
toolbar_back = "Backspace"     ; back to the main page of the tool bar
; Gameplay bar (under the map):
tool_focus = "F"               ; Focus tool: click a spot to send the attack ants there
lay_larva = "L"                ; lay one larva (food_per_larva food)
main_menu = "Escape"           ; opens the game menu (restart, save, load, settings, main menu)
toggle_fullscreen = "F11"      ; fullscreen on / off
toggle_view = "Tab"            ; switch between the isometric view and the flat debug view
toggle_pheromones = "T"        ; show / hide the pheromone trails
brush_bigger = "Equal, BracketRight"
brush_smaller = "Minus, BracketLeft"
zoom_in = "Wheel Up, PageUp"
zoom_out = "Wheel Down, PageDown"
pan = "Mouse Right"            ; hold and drag to move the map
pan_left = "Left, A"
pan_right = "Right, D"
pan_up = "Up, W"
pan_down = "Down, S"

[simulation]
ticks_per_second = 30          ; how often the simulation updates (Hz)
; Game speed: simulated seconds per real second. 0.5 = everything (walking, fights, timers)
; happens at half speed; the simulation still updates ticks_per_second times per second.
game_speed = 0.5
max_ticks_per_frame = 5        ; catch-up limit if the computer lags behind
random_seed = 0                ; 0 = different every run, any other number = repeatable run

[map]
; The map has two layers, both sized by the level file (see levels/):
;   ground tiles  what the ground is: dirt, grass, water, obstacle (and the nest on top)
;   cells         what is on the ground: pheromones and food. Finer than tiles.
; The levels use 8 px cells and 4 x 4 cells per tile, so a tile is 32 px: a usual size for
; tile images, and still fine enough for drawing paths (a level 1 map is 40 x 22 tiles).
food_lookup_region_cells = 8   ; speed-up for ants searching food (regions of 8x8 cells); rarely needs changing

[ground]
walkable = "dirt, grass, nest" ; ground types ants and creatures can walk on (water blocks them)
; Tile images: PNG files in this folder replace the plain colors (see tiles/README.md).
tile_image_folder = "res://tiles"

[moss]
; Mossy patches on dirt: decoration only (no effect on the game). Isometric view only.
; Where they are comes from smooth random noise, the same every time for a given spot.
frequency = 0.035              ; size of the patches: smaller = bigger patches
coverage = 0.3                 ; share of the dirt (roughly) that is mossy
edge_softness = 0.3            ; how gradually the moss fades out at its edges

[objects]
; Things placed on the map, with a fixed shape and a sprite (in sprites/objects/).
; Food items hold food that ants cut pieces from; their sprite loses pixels as they're eaten.
; Each type of food is collected differently (cut_time = seconds for an ant to cut a piece off,
; piece_food = food in that piece, what the ant carries home):
;   larva       fast to collect, big pieces (a killed beetle larva, or placed)
;   fruit       fast to collect, medium pieces
;   hard shell  slow to collect, big pieces (dead spiders and crickets)
;   aphids      slow to collect, medium pieces, but it never runs out: ants milk the aphids on
;               a flower, and it fills up again (renewable, regrow_per_minute)
; Obstacles block ants and spiders. Each kind has its own [object_<kind>] section:
;   label             name in the tool bar
;   footprint_radius  map pixels: it covers every cell whose center is this close to its center
;   sprite_width      map pixels, width of its sprite in the isometric view
;   food              (food only) food it holds
;   food_type, cut_time, piece_food (food an ant carries home per piece), renewable,
;                     max_ants (how many ants can cut from it at once, 0 = no limit; an ant
;                     finding it full leaves it alone for a while) (food only),
;                     regrow_per_minute (renewable food only)
food_kinds = "blueberry, strawberry, seed, larva, dead_spider, dead_cricket, aphid_flower"
obstacle_kinds = "rock, twig, high_grass, pine_cone, dead_leaf, tree_trunk, mushroom"
food_glow_size = 2.2           ; yellow glow under food: its width = sprite width x this
food_glow_color = "#ffe27a"
food_glow_opacity = 0.85

[object_blueberry]
label = "Blueberry"
footprint_radius = 10.0
sprite_width = 22.0
food = 150
food_type = "fruit"
cut_time = 1.0
piece_food = 5
renewable = false
max_ants = 0

[object_strawberry]
label = "Strawberry"
footprint_radius = 14.0
sprite_width = 28.0
food = 400
food_type = "fruit"
cut_time = 1.0
piece_food = 5
renewable = false
max_ants = 0

[object_seed]
label = "Seed"
footprint_radius = 6.0
sprite_width = 14.0
food = 60
food_type = "fruit"
cut_time = 2.0
piece_food = 3
renewable = false
max_ants = 0

[object_larva]
label = "Larva"           ; also what a killed beetle larva becomes (with the food it had grown to)
footprint_radius = 10.0
sprite_width = 26.0
food = 200
food_type = "larva"
cut_time = 1.0
piece_food = 8
renewable = false
max_ants = 0

[object_dead_spider]
label = "Dead spider"     ; also what a killed spider becomes ([creature_spider] food_when_killed + what it ate)
footprint_radius = 14.0
sprite_width = 38.0
food = 400
food_type = "hard shell"
cut_time = 3.0
piece_food = 8
renewable = false
max_ants = 0

[object_dead_cricket]
label = "Dead cricket"    ; also what a killed cricket becomes ([creature_cricket] food_when_killed)
footprint_radius = 8.0
sprite_width = 22.0
food = 120
food_type = "hard shell"
cut_time = 3.0
piece_food = 8
renewable = false
max_ants = 0

[object_aphid_flower]
label = "Aphid flower"    ; a flower with aphids on it: ants climb up to milk them
footprint_radius = 8.0
sprite_width = 30.0
food = 60
food_type = "aphids"
cut_time = 3.0
piece_food = 4
renewable = true
max_ants = 5                    ; only 5 ants fit on the stem at once
regrow_per_minute = 30.0       ; food it gets back per minute (game time) while not full

[object_rock]
label = "Rock"
footprint_radius = 18.0         ; rocks 32 px apart (one per tile) still make a wall ants can't slip through
sprite_width = 44.0

[object_twig]
label = "Twig"
footprint_radius = 12.0
sprite_width = 46.0

[object_high_grass]
label = "High grass"
footprint_radius = 12.0
sprite_width = 30.0

[object_pine_cone]
label = "Pine cone"
footprint_radius = 10.0
sprite_width = 22.0

[object_dead_leaf]
label = "Dead leaf"
footprint_radius = 16.0
sprite_width = 46.0

[object_tree_trunk]
label = "Tree trunk"            ; very tall: it goes off the top of the screen when zoomed in
footprint_radius = 26.0
sprite_width = 64.0

[object_mushroom]
label = "Mushroom"
footprint_radius = 8.0
sprite_width = 20.0

[colonies]
; A level can have several colonies: the player's ("our" colony, at the level's nest) and rivals
; (rival_nest lines in the level file). Ants of different colonies fight when they meet.
player_name = "Our colony"
rival_name = "Rival colony %d" ; %d = its number
ally_name = "Allied colony %d" ; colonies founded with the Nuptial flights upgrade
rival_tint = "#c03a30"         ; debug view: rival ants are drawn in this color
; Isometric view: rival ants use the red ant sprites (sprites/ant_rival_*.png); our nest has a flag.

[nest]
; The starting colony size is set by the level (starting_ants: 5 ants in every level).
; The nest grows with the colony: it covers about area_per_ant square pixels per ant, and every
; tile whose center is inside it becomes a nest tile. Ants count as "home" anywhere inside it.
radius = 10.0                  ; smallest nest radius (pixels), when there are few ants
area_per_ant = 32.0            ; square pixels per ant: 100 ants -> 32 px radius, 500 ants -> 71 px
emerge_interval = 0.15         ; seconds between two ants of the starting colony emerging
starting_food = 100            ; food stored in every nest at the start
; Larvae: the player spends stored food to have a larva laid (Lay 1 / Lay 5). Laying takes
; lay_time per larva, one after the other. Laid larvae are stored until they hatch (Hatch 1,
; Hatch 5, or Auto hatch = hatch every larva as soon as it's laid). Rival and allied colonies
; lay whenever they can afford it, and always auto hatch.
; Times are game seconds: at [simulation] game_speed 0.5, 1 game second = 2 real seconds.
food_per_larva = 20            ; stored food paid for each larva
lay_time = 5.0                 ; seconds to lay one larva (10 real seconds)
max_larvae = 60                ; at most this many larvae waiting in the nest (laying, stored, hatching)
hatch_time = 1.0               ; seconds for each larva to hatch into an ant (they hatch one after the other)
player_starts_with_infinite_hatch = true
max_ants = 1000                ; no ant hatches above this (keeps the game fast)
; Raids: an ant reaching a rival nest steals a stored larva or, if there is none, some stored
; food (carried home). A nest with nothing left to take is attacked directly; when its health
; runs out it is destroyed and its ants die.
hp = 300.0                     ; nest health
larva_food = 20                ; food a stolen larva is worth (what it cost)
raid_food = 8                  ; stored food a raiding ant carries away
raid_sight_radius = 100.0      ; eager fighters (see [ant_combat] join_fight_will) see rival nests this close

[maturity]
; Like ages in Age of Empires: a colony matures when it reaches a number of ants, and never goes
; back. Each maturity level unlocks more of the tech tree. ants_needed[N-1] = ants for level N.
ants_needed = "0, 40"          ; level 1 at the start, level 2 at 40 ants (add ", 120" for a level 3)

[behaviour]
; The Behaviour menu: sliders the player sets for the ants that hatch AFTER the change.
aggressivity = 0.5             ; 0 = peaceful .. 1 = aggressive: added to each ant's random will to fight (0.5 = no change)
exploring = 1.0                ; how far ants explore away from the nest: their explore time is multiplied by this
exploring_min = 0.25           ; slider range
exploring_max = 2.0

[tech_tree]
; Bought with food stored in the nest, in the Tech tree menu. 3 vocations (columns) x maturity
; levels (rows); each vocation and level has a small tree: a node needs the nodes in its
; `requires` first, and the colony must have reached its `maturity`. Each node has its own
; [tech_<name>] section: label, description, vocation, maturity, requires, cost and its values.
vocations = "fighting, hatching, harvesting"
nodes = "chitinous_armor, restraining_bite, major_ants, hunter_lifestyle, powerful_mandibles, acid_spray, corrosive_sting, super_majors, motherbase, faster_larvae, faster_larvae_2, carry_more, mushroom_harvest, guarded_paths, improved_mushrooms, nuptial_flights"
minimum_damage = 0.5           ; damage reductions never bring a hit below this

[tech_chitinous_armor]
label = "Chitinous armor"
description = "Ants take 1 less damage from every hit."
vocation = "fighting"
maturity = 1
requires = ""
cost = 40
damage_reduction = 1.0

[tech_restraining_bite]
label = "Restraining bite"
description = "Ants hold down what they fight: opponents attack and move at half speed, a bitten animal stays slowed for a while, and crickets are held much harder."
vocation = "fighting"
maturity = 1
requires = "chitinous_armor"
cost = 70
opponent_speed = 0.5           ; opponents held by our ants act at this fraction of their speed
hold_strength = 2.5            ; each of our ants holds a running animal this many times harder
slow_time = 3.0                ; seconds an animal bitten by our ants stays slowed down

[tech_major_ants]
label = "Major ants"
description = "1 in 20 new ants is a major: bigger, stronger, always eager to fight."
vocation = "fighting"
maturity = 1
requires = "chitinous_armor"
cost = 80
chance = 0.05
hp_multiplier = 2.5
attack_multiplier = 2.0
size_multiplier = 1.5          ; drawn this much bigger

[tech_hunter_lifestyle]
label = "Hunter lifestyle"
description = "Dead rival ants are worth more food."
vocation = "fighting"
maturity = 1
requires = "chitinous_armor"
cost = 60
food_multiplier = 2.0

[tech_powerful_mandibles]
label = "Powerful mandibles"
description = "Ants do 1 extra damage."
vocation = "fighting"
maturity = 2
requires = ""
cost = 120
extra_attack = 1.0

[tech_acid_spray]
label = "Acid spray"
description = "Ants spray acid at spiders and rival ants nearby, without touching them."
vocation = "fighting"
maturity = 2
requires = "powerful_mandibles"
cost = 160
range = 28.0                   ; pixels
damage = 1.0
interval = 1.5                 ; seconds between two sprays

[tech_corrosive_sting]
label = "Corrosive sting"
description = "Hits poison: the target keeps losing health for a while."
vocation = "fighting"
maturity = 2
requires = "powerful_mandibles"
cost = 150
damage_per_second = 0.5
duration = 4.0

[tech_super_majors]
label = "Super majors"
description = "Majors get even bigger and stronger (needs Major ants)."
vocation = "fighting"
maturity = 2
requires = "powerful_mandibles, major_ants"
cost = 200
hp_multiplier = 1.6            ; on top of the major's
attack_multiplier = 1.5
size_multiplier = 1.3

[tech_motherbase]
label = "Motherbase"
description = "Near the nest, ants do 1 extra damage and take 1 less."
vocation = "hatching"
maturity = 1
requires = ""
cost = 50
radius = 90.0                  ; pixels from the nest center
extra_attack = 1.0
damage_reduction = 1.0

[tech_faster_larvae]
label = "Faster larvae"
description = "Larvae are laid 25% faster."
vocation = "hatching"
maturity = 1
requires = "motherbase"
cost = 60
speed_bonus = 0.25

[tech_faster_larvae_2]
label = "Even faster larvae"
description = "Larvae are laid another 25% faster."
vocation = "hatching"
maturity = 2
requires = ""
cost = 120
speed_bonus = 0.25

[tech_carry_more]
label = "Carry more"
description = "Ants carry 1 more piece of food per trip."
vocation = "harvesting"
maturity = 1
requires = ""
cost = 50
extra_carry = 1

[tech_mushroom_harvest]
label = "Mushroom harvest"
description = "The nest grows mushrooms: a slow trickle of free food."
vocation = "harvesting"
maturity = 1
requires = "carry_more"
cost = 70
food_per_minute = 30.0         ; game minutes (15 per real minute)

[tech_guarded_paths]
label = "Guarded paths"
description = "On a worn path, ants strike first: their first hit in a fight comes at once."
vocation = "harvesting"
maturity = 1
requires = "carry_more"
cost = 60

[tech_improved_mushrooms]
label = "Improved mushrooms"
description = "Mushrooms give much more food."
vocation = "harvesting"
maturity = 2
requires = "mushroom_harvest"
cost = 120
food_per_minute = 50.0         ; on top of Mushroom harvest

[tech_nuptial_flights]
label = "Nuptial flights"
description = "Found a new allied nest anywhere (click the map). It has all your upgrades and always hatches."
vocation = "harvesting"
maturity = 2
requires = "improved_mushrooms"
cost = 250
starting_ants = 10

[painting]
; Pick a tool in the tool bar. Left click uses it; a right click goes back to the Inspect tool.
; Terrain (dirt, grass, water) is painted in whole tiles with the brush; objects are placed one per click.
brush_radius = 16.0            ; starting brush size (pixels)
brush_min_radius = 4.0
brush_max_radius = 96.0
brush_radius_step = 4.0        ; size change per button / key press
obstacle_free_radius_around_nest = 24.0 ; water and obstacles can't be placed this close to the nest

[focus]
; Focus tool: click a spot to send our attack ants there (ants with a will to fight of at least
; attack_will, and majors; the Behaviour menu's aggressivity raises everyone's will). It lays an
; "attack" trail in a circle around the nest and in a straight line from the nest to the spot,
; stronger towards the spot. Attack ants follow it and attack spiders, rival ants and nests they
; meet, and neutral animals (beetle larvae, crickets) at the spot. Click our nest to call them
; back. The trail is always shown in its own color, and fades.
attack_will = 0.5              ; about half of the ants are attack ants (will to fight is random 0..1)
neutral_radius = 40.0          ; attack ants only attack neutral animals (beetle larvae, crickets) this
                               ; close to the focused spot, or once the colony has attacked them
trail_width = 8.0              ; pixels, half the width of the trail
start_strength = 2.0           ; strength at the nest; it rises to [pheromones] max_strength at the spot
target_radius = 24.0           ; pixels: a patch of the strongest smell around the spot
nest_circle = 30.0             ; pixels around the nest (beyond its edge) also smelling of the trail, so
                               ; ants leaving the nest in any direction notice it
nest_circle_weakest = 0.4      ; the circle is start_strength where the line leaves, this x it opposite
half_life = 15.0               ; seconds for the trail to lose half its strength (lasts about a minute)
trail_color = "#ff6a3d"
trail_opacity = 0.7
redraw_interval = 0.2          ; seconds between updates of the trail display

[iso_view]
; The default view: the map seen at an angle, with pixel-art tiles and sprites.
; The flat top-down view with simple shapes is kept as the "debug" view (Tab).
; Projection: the map is turned by rotation_degrees, then squashed vertically.
;   45 and 0.5 = classic isometric (diamond tiles). 0 and 0.7 = straight on, gently tilted.
start_in_iso_view = true
rotation_degrees = 45.0
vertical_squash = 0.5
sprite_folder = "res://sprites" ; made by tools/make_art.py
; Ants and creatures (sizes in [creature_<kind>]) stand upright facing the screen, in 6 directions (towards / away from the
; screen: left, right or straight), with a 2-frame walk.
; Sprite sizes in map pixels (collisions don't change: an ant is still a 2 px circle).
ant_size = 12.0                ; width of an ant sprite
walk_frames_per_second = 8.0   ; walking animation speed
health_bar_width = 0.6         ; a hurt creature's health bar: this share of its sprite width
; Ants milking aphids climb up the flower: drawn this high up its stem (map pixels, each ant
; at its own height), up to climb_spread pixels left or right of the stem.
climb_kinds = "aphid_flower"
climb_height_min = 8.0
climb_height_max = 26.0
climb_spread = 3.0
straight_direction_angle = 22.5 ; walking within this many degrees of straight up / down the screen
                                ; shows the front / back sprite instead of a diagonal one
crumb_size = 4.0               ; food crumb carried by an ant (bigger with more pieces)
nest_width_per_radius = 2.6    ; nest mound width = nest radius x this
nest_big_from_radius = 40.0    ; the big mound (3 entrances) from this nest radius on (~160 ants)
flag_width = 14.0              ; the flag on top of our nest (map pixels)
scout_tint = "#6a5048"         ; scouts are darker ants
pheromone_opacity = 0.45       ; trails are fainter here, so the ground art stays readable

[pheromones]
max_strength = 10.0            ; a cell can never hold more than this
half_life = 45.0               ; seconds for a pheromone to lose half its strength
going_out_deposit = 1.5        ; strength laid per second by an ant that just left the nest
going_home_deposit = 3.0       ; strength laid per second by an ant that just picked up food
; Trails get weaker the longer the ant has walked. This makes trails stronger near
; their start (nest or food), so ants can follow them "backwards" by moving to stronger spots.
trail_fade_time = 15.0         ; seconds of walking after which an ant lays ~37% of its start amount
detection_threshold = 0.2      ; weaker than this = the ant ignores it (one ant passing lays ~0.5)
; Speed-up: fading every cell every tick is slow on big maps. Instead each tick fades 1/N of the
; rows by N ticks' worth. 8 = every cell fades 3.75 times per second: no visible difference.
decay_slices = 8

[paths]
; Unobstructed areas: where ants walk a lot, the ground gets worn into a path (smoother, lighter,
; less gravel and moss) and ants walk faster on it. It's not a tile type but a value of every map
; cell ("path wear"), so a dirt or grass tile can have path running through part of it.
; Every walking ant adds wear_per_second to the cell under it; wear fades with half_life.
wear_per_second = 1.0          ; an ant crossing an 8 px cell adds ~0.2
unobstructed_wear = 6.0        ; from this wear on, the cell is a path (~30 ant crossings)
max_wear = 12.0                ; wear can't build up beyond this, so unused paths fade within minutes
half_life = 120.0              ; seconds (pheromones: 20 s): paths last much longer than trails
speed_bonus = 0.4              ; ants walk 40% faster on paths
; Drawing: in the isometric view paths show tiles/path.png over the ground, in the debug view [colors] path.
edge_softness = 0.25           ; 0 = hard edges, higher = paths fade out more gradually at their edges
redraw_interval = 0.5          ; seconds between updates of the drawn paths (they change slowly)

[ant]
speed = 45.0                   ; pixels per second (crosses the whole map in ~28 s)
turn_speed = 4.0               ; max radians per second the ant can turn when following a smell
wander = 2.5                   ; random wobble in radians per second (higher = more zig-zag)
sensor_distance = 16.0         ; how far ahead the 3 smell sensors are (pixels)
sensor_angle = 0.6             ; angle between the middle and side sensors (radians, ~35 deg)
sensor_radius_in_cells = 0     ; area each sensor smells: 0 = 1 cell, 1 = 3x3 cells, 2 = 5x5...
                               ; (tested: 1 collected ~25% less food and was 2x slower, so 0 is best)
food_sight_radius = 35.0       ; ants see food piles closer than this and walk straight to them
food_reach = 6.0               ; ants this close to a food cell's center can cut from it
carry_capacity = 1             ; pieces an ant carries per trip (more with the "Carry more" upgrade)
gatherers_lay_going_out = true ; ants heading back to known food also lay a "going out" trail
; Speed-up: an ant decides where to go (smells, looks for food and enemies) only every N ticks,
; each ant at its own moment, and keeps turning the same way in between. 3 = 10 decisions per
; second at 30 Hz. Tested (8 games x 5 min each): 950 food on average vs 880 deciding every
; tick (no loss, within the usual spread), and 45% less time spent on the ants.
think_interval_ticks = 3

[ant_personality]
; Each ant is born either a SCOUT or a COLLECTOR.
;   Scouts ignore food trails and keep exploring; they only carry food they find themselves.
;   Collectors follow food trails whenever they smell one, and explore only when there is none.
scout_fraction = 0.2           ; share of ants that are scouts (the rest are collectors)
; Each ant gets a random max time to wander before giving up and going home.
; Scouts always use the explorer times; some collectors are homebodies.
homebody_fraction = 0.3        ; share of collectors that stay close to the nest
homebody_min_explore_time = 2.0
homebody_max_explore_time = 6.0
explorer_min_explore_time = 20.0
explorer_max_explore_time = 50.0
gather_give_up_time = 30.0     ; seconds to reach food when gathering before giving up and going home
full_food_avoid_time = 20.0    ; an ant finding a food item full (max_ants) leaves it alone this long

[ant_homing]
; "Little push in the right direction" towards the nest for ants going home.
; It starts at 0 and grows the longer the ant has been trying to get home.
push_growth = 0.08             ; push gained per second
push_max = 1.0                 ; strongest push (1 = turns towards the nest as fast as it can)
nest_sight_radius = 30.0       ; ants closer than this walk straight into the nest
; Getting unstuck: the push can pin an ant behind an obstacle. If an ant going home doesn't
; get closer to the nest for a while, it takes a detour with no push, then the push restarts from 0.
; Tested (U-shaped trap and long wall, 4 maps each): following trails only clears the food
; ~25% faster than also turning to a random direction; without detours ants stay stuck for good.
stuck_time = 2.5               ; seconds without getting closer before the ant counts as stuck
stuck_min_progress = 8.0       ; pixels closer it must get to count as progress
detour_time = 3.0              ; seconds of detour (only following trails, no push)
detour_random_direction = false ; true = start the detour in a random direction, false = keep heading

[ant_life]
; Ants die of old age. This is what keeps the colony size in balance: births depend on how
; much food comes in (food items, killed creatures and rival ants), deaths grow with the colony size,
; so the colony settles where the two meet. Set both lifespans to 0 for ants that never age.
lifespan_min = 900.0           ; seconds (15 minutes)
lifespan_max = 1500.0          ; seconds (25 minutes)
starting_colony_max_age = 360.0 ; the first ants start with a random age up to this
dead_ant_fade_time = 12.0      ; seconds a dead ant lies on the ground, fading away
dead_rival_food = 10           ; food a dead ant of ANOTHER colony is worth (carried home in one chunk)

[ant_combat]
hp = 10.0                      ; health points
attack = 2.0                   ; damage per hit
attack_interval = 1.0          ; seconds between two hits while touching an enemy
; Will to fight: every ant gets a random value from 0 to 1.
join_fight_will = 0.75         ; at or above: goes looking for fights it smells or sees (~25% of ants)
contact_fight_will = 0.35      ; at or above: fights an enemy it bumps into (~40% more)
                               ; below: only fights back when hit (~35%)
; Defending the nest: the will to fight gets a bonus when the enemy is close to the nest.
nest_defense_bonus = 0.5       ; bonus for an enemy right at the nest (e.g. 0.3 -> 0.8)
nest_defense_radius = 300.0    ; bonus fades to 0 at this distance from the nest (pixels)
enemy_sight_radius = 60.0      ; eager fighters see enemies this close (pixels, from the enemy's body edge)
join_fight_give_up_time = 15.0 ; seconds an eager fighter searches before going home
fight_zone_radius = 40.0       ; fighting ants lay "fight" pheromone in this radius around them
fight_deposit = 2.0            ; fight pheromone per second in each cell of the zone
fight_pheromone_half_life = 4.0 ; fades much faster than trails, so it only marks fights going on now

[creatures]
; Animals living on the map besides the ants. Each kind has a [creature_<kind>] section with:
;   label, plural, radius (body, pixels), speed, turn_speed, wander, hp, attack (damage per hit to a
;   touching ant, 0 = never fights back), attack_interval, always_hostile (true = ants fight it
;   on sight; false = only after the player sent attack ants at it), hold_per_ant (share of its
;   speed each touching ant takes away), food_object (the food item it becomes when killed),
;   sprite, sprite_size (map pixels), debug_color, and its own values.
kinds = "spider, beetle_larva, cricket"
contact_margin = 1.0           ; an ant this many pixels from a body (or another ant) still counts as touching

[creature_spider]
; Comes in from the map edge now and then. Never goes for the nest: heads for a food item and
; hunts ants it sees on the way; leaves when it has killed ants_to_eat ants or eaten its fill.
label = "Spider"
plural = "Spiders"
radius = 13.0
speed = 15.0
turn_speed = 1.0
wander = 1.5
hp = 250.0                     ; it takes a big group of ants
attack = 10.0                  ; kills an ant in one bite (an ant does 2)
attack_interval = 2.0
always_hostile = true
hold_per_ant = 0.0
food_object = "dead_spider"
food_when_killed = 250         ; plus what it ate
sprite = "spider"
sprite_size = 52.0             ; legs included
debug_color = "#ff4040"
first_arrival = 300.0          ; seconds before the first spider (10 real minutes)
arrival_interval = 180.0       ; seconds between spiders
max_alive = 1
food_sight_radius = 120.0      ; sees food this close (pixels)
hunt_sight_radius = 60.0       ; chases ants this close
search_give_up_time = 120.0    ; seconds without finding food before leaving
eat_interval = 1.0             ; seconds to eat 1 unit of food
appetite = 40                  ; leaves after eating this much
ants_to_eat = 5                ; leaves after killing this many ants

[creature_beetle_larva]
; A fat grub living near every nest from the start. Crawls slowly around and grows: the food it
; is worth rises over time. Never fights. Ants leave it alone until sent at it (Focus tool).
label = "Beetle larva"
plural = "Beetle larvae"
radius = 7.0
speed = 3.0
turn_speed = 1.5
wander = 2.0
hp = 30.0
attack = 0.0
attack_interval = 1.0
always_hostile = false
hold_per_ant = 1.0             ; one ant holding on stops it
food_object = "larva"
sprite = "beetle_larva"
sprite_size = 24.0             ; when fully grown
debug_color = "#f0e6c8"
count_per_nest = 2
distance_from_nest_min = 50.0  ; pixels
distance_from_nest_max = 90.0
roam_radius = 20.0             ; stays this close to where it started
start_food = 50                ; food it is worth at the start
food_per_minute = 30.0         ; grows by this much per minute (game time)
max_food = 200
smallest_size = 0.6            ; drawn this big at the start (x sprite_size), growing to 1

[creature_cricket]
; Hops about in a small area away from the nests. Faster than an ant. Attacked, it flees to the
; map edge, even faster. Each ant hanging on takes hold_per_ant of its speed away (Restraining
; bite much more), so it takes Restraining bite or many ants at once to catch one.
label = "Cricket"
plural = "Crickets"
radius = 5.0
speed = 35.0                   ; hopping (ants walk 45)
startle_time = 1.5             ; attacked, it freezes this long before fleeing
flee_speed = 65.0              ; fleeing: hops this fast...
flee_hop_time = 0.9            ; ...for this long, then pauses
flee_rest_time = 0.4
turn_speed = 3.0
wander = 4.0
hp = 16.0
attack = 0.0
attack_interval = 1.0
always_hostile = false
hold_per_ant = 0.25            ; 4 ants stop it
food_object = "dead_cricket"
food_when_killed = 100
sprite = "cricket"
sprite_size = 26.0
debug_color = "#9ccf5a"
start_count = 3
max_alive = 3
respawn_interval = 120.0       ; seconds between new crickets (while fewer than max_alive)
min_distance_from_nest = 220.0 ; pixels
roam_radius = 40.0
hop_time = 0.6                 ; seconds of a hop
rest_time = 2.5                ; seconds of rest between hops

[collisions]
; Ants can't overlap: touching ants are pushed apart. See docs/collision_study.md.
enabled = true
ant_radius = 2.0               ; size of an ant's body for collisions (pixels)
grid_square_size = 8.0         ; collision lookup squares; keep at ~2x the ant's diameter (fastest)

[colors]
; Colors of the debug view (and of tiles that have no image).
; Ground tiles: kept dark so ants, food and trails stand out.
dirt = "#2b2118"
grass = "#1b2a16"
water = "#13243d"
obstacle = "#6e6e78"           ; cells covered by obstacle objects (debug view)
nest = "#4a2a63"
nest_entrance = "#b06cff"
path = "#6a5a44"               ; unobstructed areas (worn paths) in the debug view
ant = "#ffffff"                ; collectors
scout = "#40e0ff"
ant_with_food = "#ffb030"
food = "#40ff60"
going_out_pheromone = "#2060ff"
going_home_pheromone = "#ff3030"
fight_pheromone = "#a08000"
creature_health_bar = "#40ff40"
ant_fighting = "#ffff40"
ant_cutting = "#80ffb0"
brush_outline = "#ffffff"
hud_text = "#e8d8b0"           ; cream

[display]
; Ants and creatures are drawn as arrows pointing where they go (their collision size doesn't change).
ant_length = 7.0               ; pixels
ant_width = 5.0
creature_length_per_radius = 2.0 ; a creature's arrow: its body radius x these
creature_width_per_radius = 1.5
carried_food_block_size = 3.0  ; side of the food block an ant carries (pixels, grows with more pieces)
nest_entrance_radius = 5.0     ; the dot in the middle of the nest
food_min_opacity = 0.35        ; a food cell with 1 unit is this opaque
food_full_opacity = 10         ; a food cell with this much food (or more) is fully opaque
creature_health_bar_gap = 5.0  ; pixels between a creature and its health bar
creature_health_bar_thickness = 2.0
pheromone_full_brightness = 3.0 ; pheromone strength drawn at full color
show_pheromones = true         ; pheromone trails shown when a level starts (toggle with T)
food_rate_window = 10.0        ; food per second is averaged over this many seconds
selection_color = "#ffffff"    ; ring around the selected ant / creature / nest / cell

[damage_numbers]
; Every hit shows the damage it did as a number rising above whoever was hurt.
show = true
received_color = "#ff5a4a"     ; damage our colony (and its allies) took
inflicted_color = "#ffd84a"    ; damage our colony dealt
other_color = "#c8c8c8"        ; fights we're not part of (a rival colony against a spider)
outline_color = "#1a120c"
font_size = 22                 ; screen pixels (the same at every zoom)
outline_size = 6
merge_time = 0.3               ; hits on the same victim within this many seconds show as one number
lifetime = 1.2                 ; seconds a number stays on screen (fading at the end)
rise = 24.0                    ; screen pixels it rises during that time
; Where a number starts: this many map pixels above the victim (over its sprite).
height_above_ant = 10.0
height_above_spider = 26.0
height_above_nest = 30.0
spread = 14.0                  ; screen pixels: numbers start up to this far left or right, so they don't stack
max_numbers = 150              ; at most this many on screen (the oldest go first)
max_waiting_events = 2000      ; hits kept for the numbers between two frames (keeps memory bounded)

[camera]
click_max_drag = 6.0           ; screen pixels: a right click moving less than this is a click (cancel), more is a drag (pan)
zoom_step = 1.15               ; zoom change per mouse wheel notch
min_zoom = 0.5                 ; how far you can zoom out, relative to "whole map fits"
max_zoom = 8.0                 ; how far you can zoom in (8 = a map pixel is 8 screen pixels)
pan_speed = 600.0              ; screen pixels per second when panning with the keys
inspect_pick_radius = 8.0      ; clicks this close (map pixels) to an ant select it
