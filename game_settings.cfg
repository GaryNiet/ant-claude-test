; ============================================================
;  GAME SETTINGS — every tunable value of the prototype.
;  Edit a value, save, and re-run the game. No code changes needed.
;
;  Format: [section] then  key = value
;    - text goes in "quotes"
;    - colors are "#RRGGBB" hex codes
;    - lines starting with ; are comments
;
;  Units: distances in pixels (1 grid cell = cell_size pixels),
;  times in seconds, speeds in pixels per second.
; ============================================================

[window]
title = "Ant Colony Simulation"
width = 1280
height = 720
background_color = "#000000"

[controls]
; Comma-separated key names (e.g. "Space, P"). Names as Godot spells them.
; Mouse: "Mouse Left", "Mouse Right", "Mouse Middle", "Wheel Up", "Wheel Down".
pause = "Space, P"
restart = "R"
paint = "Mouse Left"
erase = "Mouse Right"
tool_food = "1"
tool_obstacle = "2"
brush_bigger = "Wheel Up, Equal"
brush_smaller = "Wheel Down, Minus"

[simulation]
ticks_per_second = 30          ; how often the simulation updates (Hz)
max_ticks_per_frame = 5        ; catch-up limit if the computer lags behind
random_seed = 0                ; 0 = different every run, any other number = repeatable run

[map]
; The map is a grid of cells that store pheromones, food and obstacles.
; 160 x 90 cells of 8 px = 1280 x 720 px.
grid_width = 160               ; cells
grid_height = 90               ; cells
cell_size = 8.0                ; pixels per cell
food_lookup_region_cells = 8   ; speed-up for ants searching food (regions of 8x8 cells); rarely needs changing

[nest]
radius = 10.0                  ; ants count as "home" inside this distance from the center
ant_count = 100                ; total ants in the colony
spawn_interval = 0.15          ; seconds between two ants emerging (100 ants = 15 s)

[food]
; Food is stored per map cell (1 ant carries 1 unit). The game starts with a single round
; blob of food; everything else is painted by the player. No food appears on its own.
start_blob_distance = 320.0    ; pixels from the nest (320 = halfway from the nest to the left/right edge)
start_blob_direction = -1.0    ; degrees: 0 = right, 90 = down, 180 = left, 270 = up; negative = random
start_blob_radius = 24.0       ; pixels (~28 cells)
food_per_cell = 5              ; food in each cell of the blob (~140 food in total)

[painting]
; Left click paints the selected tool, right click erases food and obstacles.
food_per_cell = 5              ; food put in each painted cell
brush_radius = 16.0            ; starting brush size (pixels)
brush_min_radius = 4.0
brush_max_radius = 96.0
brush_radius_step = 4.0        ; size change per mouse wheel notch / key press
obstacle_free_radius_around_nest = 24.0 ; obstacles can't be painted this close to the nest

[pheromones]
max_strength = 10.0            ; a cell can never hold more than this
half_life = 20.0               ; seconds for a pheromone to lose half its strength
going_out_deposit = 1.5        ; strength laid per second by an ant that just left the nest
going_home_deposit = 3.0       ; strength laid per second by an ant that just picked up food
; Trails get weaker the longer the ant has walked. This makes trails stronger near
; their start (nest or food), so ants can follow them "backwards" by moving to stronger spots.
trail_fade_time = 15.0         ; seconds of walking after which an ant lays ~37% of its start amount
detection_threshold = 0.2      ; weaker than this = the ant ignores it (one ant passing lays ~0.5)

[ant]
speed = 45.0                   ; pixels per second (crosses the whole map in ~28 s)
turn_speed = 4.0               ; max radians per second the ant can turn when following a smell
wander = 2.5                   ; random wobble in radians per second (higher = more zig-zag)
sensor_distance = 16.0         ; how far ahead the 3 smell sensors are (pixels)
sensor_angle = 0.6             ; angle between the middle and side sensors (radians, ~35 deg)
sensor_radius_in_cells = 0     ; area each sensor smells: 0 = 1 cell, 1 = 3x3 cells, 2 = 5x5...
                               ; (tested: 1 collected ~25% less food and was 2x slower, so 0 is best)
food_sight_radius = 35.0       ; ants see food piles closer than this and walk straight to them
gatherers_lay_going_out = true ; ants heading back to known food also lay a "going out" trail

[ant_personality]
; Each ant is born either a SCOUT or a COLLECTOR.
;   Scouts ignore food trails and keep exploring; they only carry food they find themselves.
;   Collectors follow food trails whenever they smell one, and explore only when there is none.
scout_fraction = 0.2           ; share of ants that are scouts (the rest are collectors)
; Each ant gets a random max time to wander before giving up and going home.
; Scouts always use the explorer times; some collectors are homebodies.
homebody_fraction = 0.3        ; share of collectors that stay close to the nest
homebody_min_explore_time = 2.0
homebody_max_explore_time = 6.0
explorer_min_explore_time = 20.0
explorer_max_explore_time = 50.0
gather_give_up_time = 30.0     ; seconds to reach food when gathering before giving up and going home

[ant_homing]
; "Little push in the right direction" towards the nest for ants going home.
; It starts at 0 and grows the longer the ant has been trying to get home.
push_growth = 0.08             ; push gained per second
push_max = 1.0                 ; strongest push (1 = turns towards the nest as fast as it can)
nest_sight_radius = 30.0       ; ants closer than this walk straight into the nest

[collisions]
; Ants can't overlap: touching ants are pushed apart. See docs/collision_study.md.
enabled = true
ant_radius = 2.0               ; size of an ant's body for collisions (pixels)
grid_square_size = 8.0         ; collision lookup squares; keep at ~2x the ant's diameter (fastest)

[colors]
nest = "#b06cff"
ant = "#ffffff"                ; collectors
scout = "#40e0ff"
ant_with_food = "#ffb030"
food = "#40ff60"
going_out_pheromone = "#2060ff"
going_home_pheromone = "#ff3030"
obstacle = "#6e6e78"
brush_outline = "#ffffff"
hud_text = "#e0e0e0"

[display]
ant_radius = 2.0               ; pixels
nest_draw_radius = 10.0        ; pixels
food_min_opacity = 0.35        ; a food cell with 1 unit is this opaque; full at [painting] food_per_cell
pheromone_full_brightness = 3.0 ; pheromone strength drawn at full color
food_rate_window = 10.0        ; food per second is averaged over this many seconds
hud_font_size = 16
